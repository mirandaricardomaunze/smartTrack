# ─────────────────────────────────────────────────────────────────────────────
# Produção — VPS com Docker: Postgres + Backend + App do Cliente + Caddy (HTTPS).
#
# Uso (na raiz do repositório):
#   cp infra/docker/.env.prod.example infra/docker/.env.prod   # e preencher
#   docker compose --env-file infra/docker/.env.prod -f infra/docker/docker-compose.prod.yml up -d --build
#
# Primeiro arranque (base vazia) — criar as tabelas do núcleo + módulos:
#   docker compose --env-file infra/docker/.env.prod -f infra/docker/docker-compose.prod.yml \
#     run --rm backend npm run migrate -- --reset-core
# Migrações seguintes (idempotentes, sem apagar dados): remover o --reset-core.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRACK17_API_KEY: ${TRACK17_API_KEY:-}
      TRACKING_POLL_ENABLED: ${TRACKING_POLL_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_VERSION: ${NEXT_PUBLIC_API_VERSION:-v1}
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
