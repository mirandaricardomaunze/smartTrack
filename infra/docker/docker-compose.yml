version: '3.9'

# Infraestrutura local para desenvolvimento do SmartTrack.
# Uso: docker compose -f infra/docker/docker-compose.yml up -d
# Não publica a aplicação — para produção, ver docs/deploy/PRODUCTION.md.
#
# SÓ POSTGRES. Este ficheiro levantou durante muito tempo Redis, Zookeeper,
# Kafka e Kafka-UI, e nenhum módulo do repositório se ligava a nenhum deles:
# eram de um desenho de microserviços que o projeto não seguiu (é um monólito
# modular num só processo, com eventos em memória). Infraestrutura a mais não é
# neutra — gasta memória, encomprida o arranque e faz quem chega de novo assumir
# uma arquitetura que não existe.

services:
  # ─── Base de dados ─────────────────────────────────────────────────
  # `track` é o mesmo nome que o resto do projeto usa por omissão
  # (PGDATABASE). Chamou-se `sistematrack` e obrigava a acertar o .env para
  # não se ficar a olhar para uma base vazia sem perceber porquê.
  postgres:
    image: postgres:15-alpine
    container_name: sistatrack_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: track
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Adminer (DB UI) ───────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: sistematrack_adminer
    ports:
      - "8091:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  default:
    name: sistematrack_network
